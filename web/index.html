<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Acceso al panel de HorarioUTSC para capturar horarios y publicar avisos de los grupos."
    />
    <title>Acceso administrador | HorarioUTSC</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
      rel="stylesheet"
      integrity="sha384-nWN3KqaaVcbEsCjLSV+2jMjh62Iny/+mN3srM8TZeM8N6aj7eDl5wwYggjAJ4/sJ"
      crossorigin="anonymous"
    />
    <link href="css/main.css" rel="stylesheet" />
    <script type="module" src="js/login.js"></script>
  </head>
  <body>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <section id="login-acceso" class="hu-cupon" aria-labelledby="login-titulo">
            <div class="hu-cupon__cabecera">
              <span><i class="bi bi-calendar-week" aria-hidden="true"></i> HorarioUTSC</span>
              <span class="hu-cupon__cabecera--secundario">Pase de administrador</span>
            </div>
            <div class="p-4">
              <h1 id="login-titulo" class="h3 fw-bold mb-1">Acceso administrador</h1>
              <p class="text-secondary mb-4">
                Solo para quien captura horarios y avisos. Esta cuenta es de HorarioUTSC, no de la
                escuela.
              </p>

              <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

              <form id="login-formulario" novalidate>
                <div class="mb-3">
                  <label for="login-correo" class="form-label">Correo</label>
                  <input
                    type="email"
                    id="login-correo"
                    name="correo"
                    class="form-control"
                    autocomplete="username"
                    maxlength="160"
                    required
                  />
                  <div class="invalid-feedback">Escribe un correo válido.</div>
                </div>
                <div class="mb-4">
                  <label for="login-contrasena" class="form-label">Contraseña</label>
                  <input
                    type="password"
                    id="login-contrasena"
                    name="contrasena"
                    class="form-control"
                    autocomplete="current-password"
                    maxlength="200"
                    required
                  />
                  <div class="invalid-feedback">Escribe tu contraseña.</div>
                </div>
                <button type="submit" id="login-enviar" class="btn btn-primary w-100">
                  Iniciar sesión
                </button>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
