name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run db:check --workspace api
      - run: npm test --workspace api
      - run: npm ci
        working-directory: mobile
      - run: npm test
        working-directory: mobile
